{% extends "base.html" %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-people text-danger me-2"></i> Kelola User</h2>
<div class="card shadow-sm p-4 mb-4"><form method="post" action="/users" class="row g-3"><div class="col-md-3"><input name="name" class="form-control" placeholder="Nama lengkap" required></div><div class="col-md-3"><input name="email" type="email" class="form-control" placeholder="Email" required></div><div class="col-md-2"><select name="role" class="form-select" required>{% for role in ['data_entry', 'router', 'sales', 'admin'] %}<option value="{{ role }}">{{ role }}</option>{% endfor %}</select></div><div class="col-md-2"><input name="password" type="password" class="form-control" placeholder="Password" required></div><div class="col-md-2"><button class="btn btn-danger w-100" type="submit">Tambah User</button></div></form></div>
<div class="card shadow-sm"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Nama</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody>{% for item in users_list %}<tr><td>{{ item.name or item.full_name }}</td><td>{{ item.email or item.username }}</td><td>{{ item.role }}</td><td><span class="badge bg-success">Aktif</span></td></tr>{% else %}<tr><td colspan="4" class="text-center text-muted py-4">Belum ada user.</td></tr>{% endfor %}</tbody></table></div></div>
{% endblock %}
