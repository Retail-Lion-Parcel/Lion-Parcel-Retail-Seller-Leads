{% extends "base.html" %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-pencil-square text-danger me-2"></i> Input Pendataan Leads Tanah Abang</h2>

{% if success %}
<div class="alert alert-success alert-dismissible fade show" role="alert">
    {{ success }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{% endif %}
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

<div class="card shadow-sm p-4 mb-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div><h5 class="mb-1">Upload Data Bulky</h5><small class="text-muted">Gunakan file CSV atau XLSX dengan kolom sesuai template.</small></div>
        <a href="/leads/template" class="btn btn-outline-danger"><i class="bi bi-download me-1"></i> Download Template</a>
    </div>
    <form action="/leads/upload" method="POST" enctype="multipart/form-data" class="row g-2 mt-2">
        <div class="col-md-9"><input type="file" name="file" class="form-control" accept=".csv,.xlsx" required></div>
        <div class="col-md-3"><button type="submit" class="btn btn-danger w-100"><i class="bi bi-upload me-1"></i> Upload Data</button></div>
    </form>
</div>

<div class="card shadow-sm p-4">
    <form action="/leads" method="POST">
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label">Tanggal Submit</label>
                <input type="text" class="form-control" value="Otomatis saat tombol Simpan ditekan" disabled>
            </div>
            <div class="col-md-4">
                <label class="form-label">Nama Toko</label>
                <input type="text" name="store_name" class="form-control" placeholder="Contoh: Toko Jaya Busana" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">PIC Data Entry</label>
                <input type="text" class="form-control" value="{{ user.name or user.full_name or user.email }}" disabled>
            </div>

            <!-- Cluster Tanah Abang -->
            <div class="col-md-4">
                <label class="form-label">Blok</label>
                <select name="block" class="form-select" required><option value="">Pilih Blok</option>{% for item in blocks %}<option value="{{ item }}">{{ item }}</option>{% endfor %}</select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Lantai</label>
                <select name="floor" class="form-select" required><option value="">Pilih Lantai</option>{% for item in floors %}<option value="{{ item }}">{{ item }}</option>{% endfor %}</select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Los (Jika Ada)</label>
                <select name="los" class="form-select"><option value="">Pilih Los</option>{% for item in los_options %}<option value="{{ item }}">{{ item }}</option>{% endfor %}</select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Nomor</label>
                <input type="text" name="nomor" class="form-control" placeholder="Contoh: 201-203 atau 201">
            </div>

            <!-- PIC Toko -->
            <div class="col-md-4">
                <label class="form-label">Nama PIC Toko</label>
                <input type="text" name="pic_name" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Jabatan PIC Toko</label>
                <select name="pic_position" class="form-select" required><option value="">Pilih Jabatan</option>{% for item in pic_positions %}<option value="{{ item }}">{{ item }}</option>{% endfor %}</select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Nomor HP / Whatsapp</label>
                <input type="text" name="phone_number" class="form-control" placeholder="628123456789" required>
            </div>

            <!-- Ekspedisi & Tipe Kiriman -->
            <div class="col-md-4">
                <label class="form-label">Jenis Kiriman</label>
                <select name="shipment_type" class="form-select" required>
                    <option value="Domestik">Domestik</option>
                    <option value="International">International</option>
                    <option value="Keduanya">Keduanya</option>
                    <option value="Tidak Sama Sekali">Tidak Sama Sekali</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Ekspedisi Yang Digunakan Saat Ini</label>
                <select name="current_courier" class="form-select" required>
                    {% for c in couriers %}
                    <option value="{{ c }}">{{ c }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Negara Terbanyak</label>
                <input type="text" name="top_country" class="form-control" placeholder="Malaysia / Singapore">
            </div>
            <div class="col-md-2">
                <label class="form-label">Kota Terbanyak</label>
                <input type="text" name="top_city" class="form-control" placeholder="Surabaya / Medan">
            </div>

            <!-- Tonase -->
            <div class="col-md-6">
                <label class="form-label">Potensi Tonase Kiriman (KG)</label>
                <input type="number" step="0.01" name="tonnage_potential_kg" class="form-control" placeholder="100.0" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Periode Potensi Tonase</label>
                <select name="tonnage_period" class="form-select" required>
                    <option value="Hari">Per Hari</option>
                    <option value="Bulan" selected>Per Bulan</option>
                    <option value="Tahun">Per Tahun</option>
                </select>
            </div>

            <div class="col-12 mt-4 text-end">
                <button type="submit" class="btn btn-danger btn-lg px-5"><i class="bi bi-save me-2"></i> Simpan Data Leads</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
