<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - Lion Parcel Tanah Abang</title>
    <link rel="icon" type="image/png" href="/static/images/lion-parcel-icon-white.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #d32f2f, #b71c1c); min-height: 100vh; display: flex; align-items: center; }
        .card-login { border-radius: 15px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .login-logo { width: 100%; max-width: 270px; height: auto; object-fit: contain; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card card-login p-4">
                <div class="text-center mb-4">
                    <img class="login-logo" src="/static/images/lion-parcel-red.png" alt="Lion Parcel">
                    <p class="text-muted">Leads & Routing System Tanah Abang</p>
                </div>
                {% if error %}
                <div class="alert alert-danger py-2 fs-6">{{ error }}</div>
                {% endif %}
                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username / Email</label>
                        <input type="text" name="email" class="form-control" required placeholder="admin atau nama@lionparcel.local">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required placeholder="Masukkan password">
                    </div>
                    <button type="submit" class="btn btn-danger w-100 mt-2 py-2 fw-bold">LOGIN</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
